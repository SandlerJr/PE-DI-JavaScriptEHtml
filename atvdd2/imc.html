<meta charset="UTF-8">

<script>
    function pularLinha(){
        document.write("<br>");
        document.write("<br>");
    }

    function mostrar(frase){
        document.write(frase);
        pularLinha();
    }

    function calcularIMC(peso, altura){
        return peso / (altura ** 2);
    }

    function validaNome(nome) {
        if (!nome || nome.trim() === "") {
            return false;
        }
        return true;
    }

    function validaNumero(numero) {
        if (isNaN(numero) || !numero.trim() || numero <= 0) {
        console.log("Por favor, insira um número válido.");
        return false; 
        }
        return true;
    }

    var nome = prompt("Informe o seu nome");
    while (!validaNome(nome)) {
        nome = prompt("Nome inválido. Informe seu nome novamente:");
    }

    var pesoInformado = prompt(nome + ", informe seu peso");
    while (!validaNumero(pesoInformado)) {
        pesoInformado = prompt(nome + ", informe um peso válido:");
    }

    var alturaInformada = prompt(nome + ", informe a sua altura");   
    while (!validaNumero(alturaInformada)) {
        alturaInformada = prompt(nome + ", informe uma altura válida:");
    }

    var imcTotal = calcularIMC(pesoInformado , alturaInformada);

    mostrar(nome + ", o seu IMC calculado é " + imcTotal);

</script>
