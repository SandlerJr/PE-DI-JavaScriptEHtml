<meta charset="UTF-8">

<script>
    function pularLinha(){
        document.write("<br>");
        document.write("<br>");
    }

    function mostrar(frase){
        document.write(frase);
        pularLinha();
    }

    function calcularIMC(peso, altura){
        return peso / (altura ** 2);
    }

    function validaNome(nome) {
        if (!nome || nome.trim() === "") {
            return false;
        }
        return true;
    }

    var nome = prompt("Informe o seu nome");
    while (!validaNome(nome)) {
        nome = prompt("Nome inválido. Informe seu nome novamente:");
    }

    var pesoInformado = prompt(nome + ", informe seu peso");
    var alturaInformada = prompt(nome + ", informe a sua altura");    
    var imcTotal = calcularIMC(pesoInformado , alturaInformada);

    mostrar(nome + ", o seu IMC calculado é " + imcTotal);

</script>
