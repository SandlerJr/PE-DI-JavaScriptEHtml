<meta charset="UTF-8">

<script>
    function pularLinha(){
        document.write("<br>");
        document.write("<br>");
    }

    function mostrar(frase){
        document.write(frase);
        pularLinha();
    }

    function calcularIMC(peso, altura){
        var imc = peso / (altura * altura);
        mostrar('O IMC calculado é ' + imc)
    }

    calcularIMC( 73 , 1.71);
    calcularIMC( 68 , 1.72);

</script>
