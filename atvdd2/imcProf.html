<meta charset="UTF-8">

<script>
    function pularLinha(){
        document.write("<br>");
        document.write("<br>");
    }

    function mostrar(frase){
        document.write(frase);
        pularLinha();
    }

    var pesoFlavio = 73;
    var alturaFlavio = 1.71;
    var imcFlavio = pesoFlavio / (alturaFlavio * alturaFlavio);
    mostrar("O IMC do Flavio é " + imcFlavio);

</script>
