<meta charset="UTF-8">

<script>
    function pularLinha(){
        document.write("<br>");
        document.write("<br>");
    }

    function mostrar(frase){
        document.write(frase);
        pularLinha();
    }

    function calcularIMC(peso, altura){
        return imc = peso / (altura * altura);
    }

    var imcFlavio = calcularIMC( 73 , 1.71);
    var imcAmigo = calcularIMC( 68 , 1.72);

    mostrar(imcFlavio);
    mostrar(imcAmigo);

</script>
