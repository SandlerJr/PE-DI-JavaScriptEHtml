<meta charset="UTF-8">

<script>
    function pularLinha(){
        document.write("<br>");
        document.write("<br>");
    }

    function mostrar(frase){
        document.write(frase);
        pularLinha();
    }

    function comparaçaoDePontosComOAnoPassado(pontos){
        ptsAnoPassado = 28;

        if(pontos > ptsAnoPassado) {
            mostra("Seu time está melhor do que no ano passado.");
        }

        if(pontos < ptsAnoPassado) {
            mostra("Seu time está pior do que no ano passado.");
        }

        if(pontos == ptsAnoPassado) {
            mostra("Seu time está igual ao ano passado.");
        }
    }

    var vitorias = parseInt(prompt("Entre com o número de vitórias."));

    var empates = parseInt(prompt("Entre com o número de empates."));

    var pontos = (vitorias  * 3) + empates;

    mostra("Os pontos do seu time são " + pontos); 

    comparaçaoDePontosComOAnoPassado(pontos);

    mostra("FIM");

</script>
