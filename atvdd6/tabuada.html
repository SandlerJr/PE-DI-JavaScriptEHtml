<meta charset="UTF-8">

<script>
    function pularLinha(){
        document.write("<br>");
        document.write("<br>");
    }

    function mostrar(frase){
        document.write(frase);
        pularLinha();
    }

    var TabuadaDo = parseInt(prompt("Tabuada do número que você deseja calcular? (Ex: 7)"));

    for (var contador = 1; contador <= 10; contador++){
        mostrar(TabuadaDo * contador);
    }

</script>
