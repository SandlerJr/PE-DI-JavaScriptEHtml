<meta charset="UTF-8">

<script>
    function pularLinha(){
        document.write("<br>");
        document.write("<br>");
    }

    function mostrar(frase){
        document.write(frase);
        pularLinha();
    }

    var multiplicador = 1;

    while(multiplicador <= 10) {
        mostrar(7 * multiplicador);
        multiplicador = multiplicador + 1
    }

</script>
